name: Build and Release

on:
  workflow_call:
    inputs:
      version:
        description: "New version tag (e.g. v3.1.0)"
        required: true
        type: string
      commit-message:
        description: "Commit message for the version bump"
        required: true
        type: string
      convox-version:
        description: "If set, writes this value to CONVOX_VERSION and stages it"
        required: false
        type: string
        default: ""
      convox-sha256:
        description: "If set, writes this value to CONVOX_SHA256 and stages it"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version files
        run: |
          VERSION="${{ inputs.version }}"
          echo "$VERSION" > VERSION
          if [ -n "${{ inputs.convox-version }}" ]; then
            echo "${{ inputs.convox-version }}" > CONVOX_VERSION
          fi
          if [ -n "${{ inputs.convox-sha256 }}" ]; then
            echo "${{ inputs.convox-sha256 }}" > CONVOX_SHA256
          fi

      - name: Commit version bump and tag
        id: commit
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if [ -n "${{ inputs.convox-version }}" ]; then
            git add CONVOX_VERSION
          fi
          if [ -n "${{ inputs.convox-sha256 }}" ]; then
            git add CONVOX_SHA256
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "${{ inputs.commit-message }}"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Update major version alias tag
        run: |
          VERSION="${{ inputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION was not created; skipping major alias update"
            exit 0
          fi
          MAJOR="${VERSION%%.*}"
          git tag -f "$MAJOR" "$VERSION"
          git push origin "refs/tags/$MAJOR" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
