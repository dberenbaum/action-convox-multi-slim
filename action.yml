name: Convox Multitool
description: Convox CLI interface
author: Beast Awakens
icon: cloud
color: blue
inputs:
  action:
    description: >-
      Convox command to run. One of: app-param, build, build-migrate, create,
      deploy, destroy, env-copy, env-set, find-build, find-release, get-scale,
      get-rack-param, login, login-user, promote, rack-param, rollback, run,
      scale
    required: true
  password:
    description: Convox deploy key value
  host:
    description: Convox Console host address
    required: false
    default: console.convox.com
  token:
    description: Convox Console token value
  rack:
    description: Convox Rack name
  app:
    description: Convox app name
  destinationApp:
    description: Convox destination app name for build migration
  destinationRack:
    description: Convox destination rack name for build migration
  description:
    description: Convox build description
  cached:
    description: Whether to utilise the docker cache during the build
    required: false
    default: true
  errorOnZeroScale:
    description: Whether to treat a scale of 0 as an error (useful for CI pipelines)
    required: false
    default: false
  external:
    description: Build the image locally and push directly to the rack registry, bypassing the load balancer upload
    required: false
    default: false
  manifest:
    description: Use a custom path for your convox.yml
    required: false
  paramName:
    description: Name of the parameter to get or set
  paramValue:
    description: Value of the parameter to set
  release:
    description: ID of the release to promote. Only needed if you have not run a build step first or you wish to override the release id from the build
    required: false
  service:
    description: The service to run the command against
  command:
    description: The command to be run
  count:
    description: The number of instances to scale to
  env:
    description: Environment variables in the form 'key1=value1 key2=value2', or newline-separated pairs when values contain spaces
  exclude:
    description: (env-copy) Space- or newline-separated list of env var names to omit when copying from the source app
    required: false
  params:
    description: (app-param) App parameters to set in the form 'Key1=value1 Key2=value2', or newline-separated pairs when values contain spaces
outputs:
  BUILD:
    description: Build ID of the build matching the description
    value: ${{ steps.convox-action.outputs.BUILD }}
  CREATED:
    description: (create) "true" if the app was created by this step, "false" if it already existed
    value: ${{ steps.convox-action.outputs.CREATED }}
  DESTROYED:
    description: (destroy) "true" if the app was deleted by this step, "false" if it did not exist
    value: ${{ steps.convox-action.outputs.DESTROYED }}
  RELEASE:
    description: Release ID of the created build
    value: ${{ steps.convox-action.outputs.RELEASE }}
  DESIRED:
    description: Count of desired instances
    value: ${{ steps.convox-action.outputs.DESIRED }}
  RUNNING:
    description: Count of running instances
    value: ${{ steps.convox-action.outputs.RUNNING }}
  CPU:
    description: CPU scale value
    value: ${{ steps.convox-action.outputs.CPU }}
  MEMORY:
    description: Memory scale value
    value: ${{ steps.convox-action.outputs.MEMORY }}
  PARAM_VALUE:
    description: Rack parameter value
    value: ${{ steps.convox-action.outputs.PARAM_VALUE }}
  SCALING_EVENT:
    description: Boolean value to indicate if a scaling event is in progress
    value: ${{ steps.convox-action.outputs.SCALING_EVENT }}
  RUNNING_PROCESSES:
    description: Count of running processes for the service
    value: ${{ steps.convox-action.outputs.RUNNING_PROCESSES }}
  PENDING_PROCESSES:
    description: Count of pending processes for the service
    value: ${{ steps.convox-action.outputs.PENDING_PROCESSES }}
  UNHEALTHY_PROCESSES:
    description: Count of unhealthy processes for the service
    value: ${{ steps.convox-action.outputs.UNHEALTHY_PROCESSES }}
runs:
  using: 'composite'
  steps:
    - name: Install convox CLI
      shell: bash
      run: |
        CONVOX_VERSION=$(cat "$GITHUB_ACTION_PATH/CONVOX_VERSION")
        DEST="$RUNNER_TOOL_CACHE/convox/$CONVOX_VERSION"
        if [ ! -x "$DEST/convox" ]; then
          mkdir -p "$DEST"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/convox/convox/releases/download/${CONVOX_VERSION}/convox-linux" \
            -o "$DEST/convox.tmp"
          EXPECTED_SHA=$(cat "$GITHUB_ACTION_PATH/CONVOX_SHA256")
          ACTUAL_SHA=$(sha256sum "$DEST/convox.tmp" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::convox CLI checksum mismatch (expected $EXPECTED_SHA, got $ACTUAL_SHA)"
            rm -f "$DEST/convox.tmp"
            exit 1
          fi
          chmod 755 "$DEST/convox.tmp"
          mv "$DEST/convox.tmp" "$DEST/convox"
        fi
        echo "$DEST" >> "$GITHUB_PATH"
    - name: Run convox action
      id: convox-action
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/entrypoint.sh"
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_HOST: ${{ inputs.host }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_RACK: ${{ inputs.rack }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_DESTINATIONAPP: ${{ inputs.destinationApp }}
        INPUT_DESTINATIONRACK: ${{ inputs.destinationRack }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        INPUT_CACHED: ${{ inputs.cached }}
        INPUT_ERRORONZEROSCALE: ${{ inputs.errorOnZeroScale }}
        INPUT_EXTERNAL: ${{ inputs.external }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_PARAMNAME: ${{ inputs.paramName }}
        INPUT_PARAMVALUE: ${{ inputs.paramValue }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_COUNT: ${{ inputs.count }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_PARAMS: ${{ inputs.params }}